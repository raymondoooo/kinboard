# Kinboard — a private family calendar you host yourself.
#
#   1. Save this file somewhere.
#   2. docker compose up -d
#   3. Open http://localhost:3200 and pick a household password.
#
# That's the whole install. No source checkout, no .env, no build step.

services:
  kinboard:
    image: raymondoooo/kinboard:latest
    # Re-checks the registry on every `up -d`, so you stay current. Without it
    # Docker reuses whatever copy of the tag is already on disk and never asks.
    # To stay on a fixed version instead, pin the image above
    # (e.g. raymondoooo/kinboard:0.2.4) and drop this line.
    pull_policy: always
    restart: unless-stopped

    ports:
      # host:container — change the left side if 3200 is already taken.
      - "3200:3200"

    volumes:
      # The database, its WAL sidecars and the nightly backups all live here.
      # This directory IS your calendar: back it up and nothing else.
      - ./data:/app/data

    # Uncomment if you put Kinboard behind an HTTPS reverse proxy (nginx, Caddy,
    # Nginx Proxy Manager, Cloudflare Tunnel).
    # environment:
    #   # Lets the login rate limiter see real client addresses, not the proxy's.
    #   TRUST_PROXY: "1"
    #   # Marks the session cookie HTTPS-only. LEAVE THIS OFF for plain-HTTP LAN
    #   # access, or the browser will accept the cookie at login and then refuse
    #   # to send it back, and you'll bounce to the login form forever.
    #   SECURE_COOKIES: "true"
