# Docker Hub's listing page is the first thing most people see, and it had drifted
# from the repo — it told users to map `-p 3200:3000`, which is the wrong container
# port and fails on first run. Keeping it in a file here, synced automatically,
# means it can't silently go stale again the way a hand-edited web form does.
#
# docs/DOCKERHUB.md rather than README.md: Docker Hub cannot render the README's
# relative image paths, so that file carries absolute raw.githubusercontent URLs.
name: sync Docker Hub description

on:
  push:
    branches: [main]
    paths:
      - docs/DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  # Lets the description be re-pushed without touching the file — useful after
  # rotating the token, or to recover if a run failed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # DOCKERHUB_TOKEN can push images but NOT edit repo metadata — Docker Hub
      # returns 403 Forbidden for that. Editing the description needs a
      # higher-scoped credential (a PAT with Read/Write/Delete, or the account
      # password), so it lives in its own secret: swapping the publish token for
      # a broader one would widen what a leak of it costs, and would risk
      # breaking releases.
      #
      # Set DOCKERHUB_DESCRIPTION_TOKEN to enable this. Until then it falls back
      # to DOCKERHUB_TOKEN and this job simply fails, which is loud but harmless
      # — nothing else depends on it.
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/kinboard
          # Docker Hub truncates this at 100 BYTES, not characters — an em dash
          # costs three. Keep it short and check with `printf '%s' "..." | wc -c`.
          short-description: "Self-hosted family calendar — events, meals, chores, iCal feeds, push. One container, SQLite."
          readme-filepath: ./docs/DOCKERHUB.md
