name: build, test, publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# packages:write is what lets the publish job push to GHCR using the built-in
# GITHUB_TOKEN — no extra secret needed for that registry.
permissions:
  contents: read
  packages: write

jobs:
  # Builds the image and exercises it the way a new self-hoster would: empty
  # volume, no pre-seeded database, no host state. This is the check that catches
  # "works on my machine" regressions before they reach anyone.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t kinboard:ci .

      - name: Start container on a clean volume
        run: |
          docker run -d --name kinboard-ci -p 3200:3200 \
            -v kinboard-ci-data:/app/data kinboard:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3200/setup; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container did not come up"; docker logs kinboard-ci; exit 1

      - name: First-run flow (setup, login, event CRUD)
        run: |
          set -e
          B=http://localhost:3200

          # Fresh install must redirect to the setup wizard.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$B/")
          [ "$code" = "302" ] || { echo "expected 302 to /setup, got $code"; exit 1; }

          curl -fsS -c /tmp/j -X POST "$B/api/setup" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","timeZone":"America/New_York","password":"ci-password-123"}' | grep -q '"ok":true'

          curl -fsS -b /tmp/j "$B/api/config" | grep -q '"name":"CI"'

          curl -fsS -b /tmp/j -X POST "$B/api/events" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI event","date":"2030-01-01","allDay":true}' | grep -q '"ok":true'
          curl -fsS -b /tmp/j "$B/api/events" | grep -q 'CI event'

          # Logout must actually invalidate the session.
          curl -fsS -b /tmp/j -c /tmp/j -X POST "$B/api/logout" >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/j "$B/api/config")
          [ "$code" = "401" ] || { echo "expected 401 after logout, got $code"; exit 1; }

          # Wrong password must be rejected.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/api/login" \
            -H 'Content-Type: application/json' -d '{"password":"nope"}')
          [ "$code" = "401" ] || { echo "expected 401 for bad password, got $code"; exit 1; }
          echo "first-run flow OK"

      - name: A hostile calendar feed must not take down the calendar
        run: |
          set -e
          B=http://localhost:3200
          curl -fsS -c /tmp/j -X POST "$B/api/login" \
            -H 'Content-Type: application/json' -d '{"password":"ci-password-123"}' >/dev/null

          # Served from the runner; the container reaches it on the bridge gateway.
          mkdir -p /tmp/ics && cd /tmp/ics
          # Feed events are filtered to the display window (-1 month to +1 year),
          # so these have to be dated relative to now or the test would pass for
          # the wrong reason once the hardcoded date fell out of range.
          SOON=$(date -u -d '+30 days' +%Y%m%d)
          # A real school-district feed emitted DTSTART:TBD. node-ical leaves an
          # unparseable date as a plain string, which threw inside expansion and
          # left every /api/events request hanging forever with no response.
          printf 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:ok\r\nDTSTART:%sT140000Z\r\nDTEND:%sT150000Z\r\nSUMMARY:Good event\r\nEND:VEVENT\r\nBEGIN:VEVENT\r\nUID:bad\r\nDTSTART:TBD\r\nDTEND:TBD\r\nSUMMARY:Bad event\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n' "$SOON" "$SOON" > bad.ics
          # FREQ=MINUTELY over the 13-month display window is ~570k occurrences:
          # it pinned a CPU at 100% indefinitely, once per browser refresh.
          printf 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:flood\r\nDTSTART:%sT000000Z\r\nDTEND:%sT000100Z\r\nRRULE:FREQ=MINUTELY;INTERVAL=1\r\nSUMMARY:Flood\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n' "$SOON" "$SOON" > flood.ics
          python3 -m http.server 8899 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 1
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          [ -n "$GW" ] || { echo "FAIL: could not determine the bridge gateway address"; exit 1; }

          for f in bad flood; do
            curl -fsS -b /tmp/j -X POST "$B/api/feeds" -H 'Content-Type: application/json' \
              -d "{\"url\":\"http://$GW:8899/$f.ics\",\"label\":\"$f\"}" >/dev/null
          done

          # Must answer promptly, and the sane event on the broken feed must survive.
          code=$(curl -s -m 30 -o /tmp/ev.json -w '%{http_code}' -b /tmp/j "$B/api/events")
          [ "$code" = "200" ] || { echo "FAIL: /api/events returned $code with a hostile feed attached"; exit 1; }
          grep -q 'Good event' /tmp/ev.json || { echo "FAIL: one bad VEVENT suppressed the rest of its feed"; exit 1; }
          grep -q 'CI event' /tmp/ev.json || { echo "FAIL: a bad feed suppressed the household's own events"; exit 1; }

          # Importing that rule would persist it into our own events table, where
          # there is no feed left to unsubscribe from.
          curl -fsS -b /tmp/j -X POST "$B/api/feeds/import" -H 'Content-Type: application/json' \
            -d "{\"url\":\"http://$GW:8899/flood.ics\",\"dryRun\":true}" | grep -q '"seriesCount":0' \
            || { echo "FAIL: import accepted a sub-hourly repeat rule"; exit 1; }

          # Cloud instance metadata must be unreachable via a feed URL.
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/j -X POST "$B/api/feeds" \
            -H 'Content-Type: application/json' \
            -d '{"url":"http://169.254.169.254/latest/meta-data/","label":"metadata"}')
          [ "$code" = "400" ] || { echo "FAIL: feed URL reached link-local metadata (got $code)"; exit 1; }

          docker inspect -f '{{.State.Status}}' kinboard-ci | grep -q running \
            || { echo "FAIL: container is not running"; exit 1; }

          # Leave no feeds behind: the URLs stop resolving when this step ends,
          # and later steps shouldn't pay their fetch timeouts.
          for id in $(curl -fsS -b /tmp/j "$B/api/feeds" | grep -o '"id":"[^"]*"' | cut -d'"' -f4); do
            curl -fsS -b /tmp/j -X DELETE "$B/api/feeds/$id" >/dev/null
          done
          echo "hostile feeds contained"

      - name: Login rate limit must not be bypassable via X-Forwarded-For
        run: |
          set -e
          B=http://localhost:3200
          # TRUST_PROXY is unset here, so forged X-Forwarded-For values must NOT
          # create separate rate-limit buckets. Regression test for a real bug:
          # trusting that header unconditionally gave unlimited password guesses.
          seen429=0
          for i in $(seq 1 16); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/api/login" \
              -H "X-Forwarded-For: 10.9.$i.$i" \
              -H 'Content-Type: application/json' -d '{"password":"wrong"}')
            [ "$code" = "429" ] && seen429=1
          done
          [ "$seen429" = "1" ] || { echo "FAIL: rate limit bypassed by spoofed X-Forwarded-For"; exit 1; }
          echo "rate limit holds against spoofing"

      - name: Editing a deleted row must be 404, not 500
        run: |
          set -e
          B=http://localhost:3200
          # The API returns the event as `uid`, not `id` — toClientEvent renames it.
          id=$(curl -fsS -b /tmp/j -X POST "$B/api/events" -H 'Content-Type: application/json' \
            -d '{"title":"Doomed","date":"2030-06-01","allDay":true}' \
            | grep -o '"uid":"[^"]*"' | head -1 | cut -d'"' -f4)
          [ -n "$id" ] || { echo "FAIL: could not read the new event's id"; exit 1; }
          curl -fsS -b /tmp/j -X DELETE "$B/api/events/$id" >/dev/null
          # One device deleting while another edits is routine on a shared
          # family calendar. It used to answer 500 "No rows found", which reads
          # as "the server is broken" and hides real faults in the logs.
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/j -X PATCH "$B/api/events/$id" \
            -H 'Content-Type: application/json' -d '{"title":"Edited after delete"}')
          [ "$code" = "404" ] || { echo "FAIL: editing a deleted event returned $code, expected 404"; exit 1; }

          # A genuinely malformed body is the client's fault: 400, not 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/j -X POST "$B/api/events" \
            -H 'Content-Type: application/json' -d '{"title":')
          [ "$code" = "400" ] || { echo "FAIL: malformed JSON returned $code, expected 400"; exit 1; }
          echo "missing rows and bad bodies answer 4xx"

      - name: Page structure must be intact
        run: |
          # Nesting, not tag balance. A settings reorder once moved seven
          # sections out of the page container and into <head>. Every tag was
          # still balanced, so a balance check passed and a visibly broken page
          # shipped in a release.
          python3 scripts/check-page-structure.py 'public/*.html'

      - name: No unescaped interpolation into innerHTML
        run: |
          # The share page is public and renders titles that can come straight
          # from a third-party iCal feed. One field there was interpolated raw.
          python3 - <<'EOF'
          import re, glob, sys
          SAFE = re.compile(r'^\s*(esc|escapeHtml|encodeURIComponent|Number|parseInt|parseFloat)\s*\(')
          bad = []
          for f in sorted(glob.glob('public/*.html')):
              src = open(f).read()
              for m in re.finditer(r'innerHTML\s*(?:\+)?=\s*`', src):
                  i = m.end(); j = i
                  while j < len(src):
                      if src[j] == '`' and src[j-1] != '\\': break
                      j += 1
                  for e in re.finditer(r'\$\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}', src[i:j]):
                      x = e.group(1).strip()
                      if SAFE.match(x): continue
                      if re.fullmatch(r"[^`]*\?\s*'[^']*'\s*:\s*'[^']*'", x): continue
                      # Report the bare expression. Writing it wrapped in
                      # dollar-brace-brace made GitHub try to evaluate it as one
                      # of its own workflow expressions and reject the file.
                      bad.append(f"{f}: {x[:70]}")
          if bad:
              print("FAIL: unescaped interpolation into innerHTML:")
              [print("  " + b) for b in bad]
              sys.exit(1)
          print("all innerHTML interpolations are escaped")
          EOF

      - name: Checking a chore off twice must pay once
        run: |
          set -e
          B=http://localhost:3200
          curl -fsS -b /tmp/j -X PATCH "$B/api/settings" -H 'Content-Type: application/json' \
            -d '{"point_value_cents":25}' >/dev/null
          curl -fsS -b /tmp/j -X POST "$B/api/members" -H 'Content-Type: application/json' \
            -d '{"display_name":"Kid"}' >/dev/null

          # A one-off chore, tapped twice. This needed no concurrency to pay
          # double: nothing checked the row was actually changing state.
          one=$(curl -fsS -b /tmp/j -X POST "$B/api/todos" -H 'Content-Type: application/json' \
            -d '{"title":"CI once","people":["Kid"],"points":10}' \
            | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -fsS -b /tmp/j -X PATCH "$B/api/todos/$one" -H 'Content-Type: application/json' -d '{"done":true}' >/dev/null
          curl -fsS -b /tmp/j -X PATCH "$B/api/todos/$one" -H 'Content-Type: application/json' -d '{"done":true}' >/dev/null

          # A weekly chore, five devices at once. This paid five times AND
          # advanced the chore five weeks, so it disappeared for a month.
          rec=$(curl -fsS -b /tmp/j -X POST "$B/api/todos" -H 'Content-Type: application/json' \
            -d '{"title":"CI weekly","people":["Kid"],"points":8,"recurring":"weekly","dueDate":"2030-08-14"}' \
            | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          for i in 1 2 3 4 5; do
            curl -s -b /tmp/j -X PATCH "$B/api/todos/$rec" -H 'Content-Type: application/json' -d '{"done":true}' -o /dev/null &
          done
          wait
          sleep 1

          curl -fsS -b /tmp/j "$B/api/chores/completions" > /tmp/comp.json
          once=$(grep -o '"title":"CI once"' /tmp/comp.json | wc -l)
          week=$(grep -o '"title":"CI weekly"' /tmp/comp.json | wc -l)
          [ "$once" = "1" ] || { echo "FAIL: double-tapped chore recorded $once completions, expected 1"; exit 1; }
          [ "$week" = "1" ] || { echo "FAIL: 5 simultaneous check-offs recorded $week completions, expected 1"; exit 1; }

          curl -fsS -b /tmp/j "$B/api/todos" | grep -q '"due_date":"2030-08-21"' \
            || { echo "FAIL: weekly chore did not advance exactly one week"; exit 1; }
          echo "chores pay once per completion"

      - name: Reminders must fire once across a DST change
        run: |
          # Reminder windows used to be wall-clock arithmetic, which assumes
          # every hour is 60 minutes. On the night the clocks go back, 01:30
          # local happens twice, so a reminder due then went out twice — an
          # hour apart, the first an hour early.
          docker cp kinboard-ci:/app/server/notify.js /tmp/notify.js
          node -e "
            const fs=require('fs');
            const src=fs.readFileSync('/tmp/notify.js','utf8');
            const grab=(re)=>{const m=src.match(re); if(!m) throw new Error('missing '+re); return m[0];};
            eval([grab(/const dtfCache[\s\S]*?\n}/),
                  grab(/function offsetFormatter[\s\S]*?\n  return f;\n}/),
                  grab(/function tzOffsetMinutes[\s\S]*?\n}/),
                  grab(/function localToInstant[\s\S]*?\n}/)].join('\n'));
            const TICK=5, LEAD=60, TZ='America/New_York';
            function fires(startUTC,hours,date,mins){
              let n=0,t=startUTC;
              for(let i=0;i<hours*60/TICK;i++){
                const d=(localToInstant(date,mins,TZ)-t)/60000;
                if(d>=LEAD&&d<LEAD+TICK)n++;
                t+=TICK*60000;
              }
              return n;
            }
            const cases=[
              ['fall back 02:30',    Date.UTC(2026,10,1,3,0), 8,'2026-11-01',150],
              ['spring forward 04:00',Date.UTC(2026,2,8,5,0),  8,'2026-03-08',240],
              ['ordinary day 09:00', Date.UTC(2026,6,15,6,0),  8,'2026-07-15',540],
            ];
            let bad=0;
            for(const [name,s,h,d,m] of cases){
              const n=fires(s,h,d,m);
              if(n!==1){ console.log('FAIL: '+name+' fired '+n+' times, expected 1'); bad++; }
              else console.log('  ok: '+name+' fired once');
            }
            process.exit(bad?1:0);
          "

      - name: Subscribed calendars must trigger reminders too
        run: |
          set -e
          B=http://localhost:3200
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          mkdir -p /tmp/ics2 && cd /tmp/ics2
          python3 - <<'EOF'
          import datetime
          t = datetime.datetime.now(datetime.UTC) + datetime.timedelta(minutes=62)
          s = t.strftime('%Y%m%dT%H%M00Z')
          e = (t + datetime.timedelta(hours=1)).strftime('%Y%m%dT%H%M00Z')
          open('team.ics','w').write(
            'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:g1\r\n'
            f'DTSTAMP:{s}\r\nDTSTART:{s}\r\nDTEND:{e}\r\n'
            'SUMMARY:Feed practice\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n')
          EOF
          python3 -m http.server 8897 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 1
          curl -fsS -b /tmp/j -X POST "$B/api/feeds" -H 'Content-Type: application/json' \
            -d "{\"url\":\"http://$GW:8897/team.ics\",\"label\":\"Team\"}" >/dev/null

          # A typed-in event at the same offset, as the control.
          docker exec kinboard-ci node -e "
            const db=require('better-sqlite3')('/app/data/kinboard.db');
            const t=new Date(Date.now()+62*60000);
            const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(t);
            const g=k=>p.find(x=>x.type==k).value;
            db.prepare(\"INSERT INTO events (id,title,date,start_time,end_time,all_day,people) VALUES (?,?,?,?,?,0,'[]')\")
              .run(require('crypto').randomUUID(),'Typed practice',g('year')+'-'+g('month')+'-'+g('day'),g('hour')+':'+g('minute')+':00',g('hour')+':'+g('minute')+':00');
            db.prepare(\"INSERT OR REPLACE INTO push_subscriptions (id,endpoint,p256dh,auth,label,device_id,notify_people,digest_enabled,reminders_enabled,on_add_enabled,reminder_minutes) VALUES (?,?,?,?,?,?,'[]',1,1,1,60)\")
              .run(require('crypto').randomUUID(),'https://fake.invalid/e','k','a','CI phone','dev-ci');
          "

          # Stub the transport so this tests which occurrences the trigger
          # SELECTS, not whether a push service is reachable. PORT is overridden
          # because requiring notify pulls in index, which binds a port.
          out=$(docker exec -e PORT=3999 kinboard-ci node -e "
            const push=require('/app/server/push.js');
            push.sendToSubscription=async(s,p)=>{ console.log('SEL:'+p.title); return true; };
            const notify=require('/app/server/notify.js');
            (async()=>{ await notify.checkDueReminders(); process.exit(0); })();
          " 2>&1)
          echo "$out" | grep -q 'SEL:Typed practice' || { echo "FAIL: typed-in event did not trigger a reminder"; echo "$out"; exit 1; }
          # Feed events carry a UTC instant while typed-in events are floating
          # local wall-clock. Merging them without converting silently files a
          # feed event under the wrong day, so it never fires.
          echo "$out" | grep -q 'SEL:Feed practice' || { echo "FAIL: subscribed calendar did not trigger a reminder"; echo "$out"; exit 1; }
          echo "typed-in and subscribed events both trigger reminders"

      - name: VAPID subject must be one Apple will accept
        run: |
          # Apple validates the VAPID `sub` claim and rejects anything that isn't
          # an https URL or a mailto with a real domain. The old default,
          # mailto:kinboard@localhost, was accepted by Google and Microsoft and
          # refused by Apple with a bare 403 — so push worked everywhere except
          # iPhones and iPads, and the only symptom was "Nothing was sent".
          out=$(docker exec kinboard-ci node -e "
            const src=require('fs').readFileSync('/app/server/push.js','utf8');
            eval(src.match(/const DEFAULT_VAPID_SUBJECT[\s\S]*?\n}/)[0]);
            const ok=s=>/^https:\/\/[^\s\/]+\.[^\s\/]+/i.test(s)||/^mailto:[^@\s]+@[^@\s.]+\.[^@\s.]+/i.test(s);
            delete process.env.VAPID_SUBJECT;
            const d=vapidSubject();
            if(!ok(d)){ console.log('BAD_DEFAULT:'+d); process.exit(1); }
            process.env.VAPID_SUBJECT='mailto:kinboard@localhost';
            if(vapidSubject()!==d){ console.log('BAD_OVERRIDE_NOT_REJECTED'); process.exit(1); }
            process.env.VAPID_SUBJECT='mailto:real@example.com';
            if(vapidSubject()!=='mailto:real@example.com'){ console.log('VALID_OVERRIDE_REJECTED'); process.exit(1); }
            console.log('OK:'+d);
          " 2>&1) || { echo "FAIL: $out"; exit 1; }
          echo "$out" | grep -q '^OK:' || { echo "FAIL: $out"; exit 1; }
          echo "$out"

      - name: kinevents import must still work against the current schema
        run: |
          set -e
          # The importer writes straight into the database, so it drifts out of
          # step with schema changes silently — bumping SCHEMA_VERSION once left
          # it verified only against the previous version. Runs on its own
          # container and volume so it never touches the main test instance.
          docker run -d --name kinboard-mig -p 3300:3200 -v kinboard-mig-data:/app/data kinboard:ci
          # 2>/dev/null: the first probes land before the server binds, and a
          # connection-reset message there reads like a failure in the log.
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3300/setup 2>/dev/null && break; sleep 1; done
          curl -fsS -X POST http://localhost:3300/api/setup -H 'Content-Type: application/json' \
            -d '{"name":"tmp","timeZone":"UTC","password":"mig-password-123"}' >/dev/null

          # Dates must sit inside the display window (-1 month to +1 year) or a
          # recurring series expands to nothing and the test fails for the wrong
          # reason. Compute them rather than hardcoding.
          ONE=$(date -u -d '+40 days' +%Y-%m-%d)
          WK=$(date -u -d '+10 days' +%Y-%m-%d)
          WKEND=$(date -u -d '+120 days' +%Y-%m-%d)
          SKIP=$(date -u -d '+24 days' +%Y-%m-%d)   # one occurrence of the weekly series
          DUE=$(date -u -d '+5 days' +%Y-%m-%d)
          cat > /tmp/export.json <<EOF
          {"exportedAt":"2026-01-01T00:00:00Z","source":"kinevents",
           "tenant":{"name":"Imported Family","time_zone":"America/New_York","weeks_to_show":5,
             "first_day_of_week":1,"theme":"forest","zip":"08080","latitude":39.75,"longitude":-75.11,
             "weather_units":"fahrenheit","holidays":["thanksgiving"],"is_public":false,
             "share_token":"11111111-2222-3333-4444-555555555555","share_keywords":["game"]},
           "members":[{"id":"aaaaaaaa-0000-0000-0000-000000000001","display_name":"Kid","color":"#e11d48","emoji":"K","member_type":"person","created_at":"2026-01-01T00:00:00Z"}],
           "events":[
             {"id":"bbbbbbbb-0000-0000-0000-000000000001","title":"One off","date":"$ONE","start_time":"09:45:00","end_time":"11:00:00","all_day":false,"people":["Kid"],"location":"Field 3","recurring":null,"ends_on":null,"exdates":[],"rrule":null,"share_override":null,"created_at":"2026-01-01T00:00:00Z","updated_at":"2026-01-01T00:00:00Z"},
             {"id":"bbbbbbbb-0000-0000-0000-000000000002","title":"Weekly thing","date":"$WK","start_time":"17:30:00","end_time":"19:00:00","all_day":false,"people":["Kid"],"location":null,"recurring":"weekly","ends_on":"$WKEND","exdates":["$SKIP"],"rrule":null,"share_override":null,"created_at":"2026-01-01T00:00:00Z","updated_at":"2026-01-01T00:00:00Z"}],
           "feeds":[{"id":"cccccccc-0000-0000-0000-000000000001","name":"School","url":"https://example.invalid/s.ics","fixed_person":null,"color":"#16a34a","last_synced_at":null,"emoji":"S","display_name":"School","category":"family","never_share":true}],
           "meals":[{"id":"dddddddd-0000-0000-0000-000000000001","date":"$WK","meal_type":"dinner","title":"Tacos","people":["Kid"],"notes":null,"created_at":"2026-01-01T00:00:00Z","updated_at":"2026-01-01T00:00:00Z"}],
           "todos":[{"id":"eeeeeeee-0000-0000-0000-000000000001","title":"Bins","done":false,"people":["Kid"],"due_date":"$DUE","recurring":"weekly","notes":null,"created_at":"2026-01-01T00:00:00Z","updated_at":"2026-01-01T00:00:00Z","completed_at":null}]}
          EOF
          docker cp /tmp/export.json kinboard-mig:/tmp/import.json

          docker exec kinboard-mig node scripts/import-kinevents.js --file /tmp/import.json --data-dir /app/data --dry-run \
            | grep -q 'Dry run complete' || { echo "FAIL: dry run did not complete"; exit 1; }
          docker exec kinboard-mig node scripts/import-kinevents.js --file /tmp/import.json --data-dir /app/data > /tmp/imp.log 2>&1 \
            || { echo "FAIL: import errored"; cat /tmp/imp.log; exit 1; }
          grep -q 'events: 2' /tmp/imp.log || { echo "FAIL: expected 2 events imported"; cat /tmp/imp.log; exit 1; }

          curl -fsS -c /tmp/mj -X POST http://localhost:3300/api/login -H 'Content-Type: application/json' \
            -d '{"password":"mig-password-123"}' >/dev/null
          curl -fsS -b /tmp/mj http://localhost:3300/api/config | grep -q 'Imported Family' \
            || { echo "FAIL: tenant settings did not carry across"; exit 1; }
          curl -fsS -b /tmp/mj http://localhost:3300/api/events > /tmp/mev.json
          grep -q 'One off' /tmp/mev.json      || { echo "FAIL: one-off event missing"; exit 1; }
          grep -q 'Weekly thing' /tmp/mev.json || { echo "FAIL: recurring event missing"; exit 1; }
          # The excluded date must not come back as an occurrence.
          grep -q "${SKIP}T" /tmp/mev.json && { echo "FAIL: EXDATE was not honoured"; exit 1; }

          # Re-importing the same export must skip, not duplicate.
          docker exec kinboard-mig node scripts/import-kinevents.js --file /tmp/import.json --data-dir /app/data --force > /tmp/imp2.log 2>&1
          grep -q 'events: 0' /tmp/imp2.log || { echo "FAIL: re-import was not idempotent"; cat /tmp/imp2.log; exit 1; }
          echo "kinevents import works against the current schema"

      - name: App must run as a non-root user
        run: |
          # Read the numeric uid of PID 1 from /proc rather than parsing `ps`.
          # busybox's ps ignores `-o user= -p 1` and returns an empty string,
          # which made `[ "$u" != "root" ]` pass vacuously — the check would have
          # stayed green even if the app were running as root. Fail loudly if the
          # value can't be read at all.
          uid=$(docker exec kinboard-ci awk '/^Uid:/{print $2}' /proc/1/status)
          [ -n "$uid" ] || { echo "FAIL: could not read uid of PID 1"; exit 1; }
          [ "$uid" != "0" ] || { echo "FAIL: app runs as root (uid 0)"; exit 1; }
          echo "app runs as uid $uid ($(docker exec kinboard-ci id -nu "$uid" 2>/dev/null || echo unknown))"

      - name: Runtime image must not ship a build toolchain
        run: |
          # The compiler exists only to build better-sqlite3 and belongs in the
          # build stage. If it reappears here, the multi-stage split has
          # regressed and every user is pulling ~160MB of gcc.
          for b in gcc g++ make python3; do
            if docker exec kinboard-ci sh -c "command -v $b" >/dev/null 2>&1; then
              echo "FAIL: $b present in the runtime image"; exit 1
            fi
          done
          echo "runtime image is clean"
          docker image inspect kinboard:ci --format 'image size: {{.Size}} bytes'

      - name: Docker healthcheck must report healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' kinboard-ci 2>/dev/null || echo none)
            [ "$s" = "healthy" ] && { echo "healthy after ${i}s"; exit 0; }
            [ "$s" = "unhealthy" ] && { echo "FAIL: unhealthy"; docker logs kinboard-ci; exit 1; }
            sleep 1
          done
          echo "FAIL: never became healthy (last status: $s)"; docker logs kinboard-ci; exit 1

      - name: Data must survive a container recreate
        run: |
          set -e
          docker rm -f kinboard-ci >/dev/null
          docker run -d --name kinboard-ci2 -p 3200:3200 \
            -v kinboard-ci-data:/app/data kinboard:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3200/ && break; sleep 1; done
          # Setup is already done, so / must serve the app (200) rather than redirect.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/)
          [ "$code" = "200" ] || { echo "data did not persist (got $code)"; exit 1; }
          curl -fsS -c /tmp/j2 -X POST http://localhost:3200/api/login \
            -H 'Content-Type: application/json' -d '{"password":"ci-password-123"}' | grep -q '"ok":true'
          curl -fsS -b /tmp/j2 http://localhost:3200/api/events | grep -q 'CI event'
          echo "persistence OK"

      - name: A newer database must refuse to boot on an older binary
        run: |
          set -e
          # Simulate a rollback: bump the stored schema version past what this
          # build understands, then confirm the container refuses to start
          # rather than writing into a schema it doesn't know.
          docker rm -f kinboard-ci2 >/dev/null 2>&1 || true
          docker run --rm -v kinboard-ci-data:/app/data --entrypoint node kinboard:ci \
            -e "const D=require('better-sqlite3');const d=new D('/app/data/kinboard.db');d.pragma('user_version = 9999');console.log('bumped to 9999')"

          if docker run --name kinboard-guard -v kinboard-ci-data:/app/data kinboard:ci; then
            echo "FAIL: started against a newer database"; exit 1
          fi
          docker logs kinboard-guard 2>&1 | grep -q "REFUSING TO START" \
            || { echo "FAIL: no downgrade warning"; docker logs kinboard-guard; exit 1; }
          echo "downgrade guard works"
          docker rm -f kinboard-guard >/dev/null 2>&1 || true

      - name: Container logs (always)
        if: always()
        run: docker logs kinboard-ci2 2>&1 || docker logs kinboard-ci 2>&1 || true

  # Only fires on a v* tag, and only after `test` passes. arm64 is not optional:
  # a lot of self-hosters run this on a Raspberry Pi, and better-sqlite3 has a
  # native binding that has to genuinely build for ARM.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GHCR as well as Docker Hub: Docker Hub rate-limits anonymous pulls, which
      # is a real problem for self-hosters who redeploy often. Same image, two
      # places, no extra credentials.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the full tag ladder from the git tag — v1.2.3 produces
      # :1.2.3, :1.2, :1 and :latest — so users can pin as tightly or as loosely
      # as they want. Also emits the OCI labels (source, revision, created,
      # version) that link the image back to this repo.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kinboard
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
